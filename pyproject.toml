[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gpuo"
version = "0.1.0"
description = "Run one training script across your own GPU targets (Kaggle, local, paid) with automatic checkpoint and resume."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Apurbo Biswas" }]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
kaggle = ["kaggle>=1.6"]
s3 = ["boto3>=1.34"]
torch = ["torch>=2.0"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
gpuo = "gpuo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gpuo"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
